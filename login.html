<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BTC Invest</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --orange: #f7931a;
            --dark: #070b12;
            --card: #101722;
            --border: #202b3a;
            --muted: #9ba7b7;
            --red: #ff5c5c;
        }

        body {
            min-height: 100vh;
            background: #070b12;
            color: white;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid var(--border);
        }

        .nav {
            max-width: 1100px;
            min-height: 70px;
            margin: auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-size: 21px;
            font-weight: bold;
        }

        .logo-icon {
            width: 39px;
            height: 39px;
            border-radius: 50%;
            background: var(--orange);
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            font-weight: bold;
        }

        .home {
            color: #cbd3df;
            text-decoration: none;
            font-size: 14px;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 35px;
        }

        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: var(--orange);
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #d8dee7;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #0b111a;
            border: 1px solid var(--border);
            border-radius: 9px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--orange);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: var(--orange);
            color: #111;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        .error {
            background: rgba(255,92,92,.08);
            border: 1px solid rgba(255,92,92,.25);
            color: var(--red);
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: var(--muted);
            font-size: 13px;
        }

        .register a {
            color: var(--orange);
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 25px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="nav">

        <a href="index.html" class="logo">
            <div class="logo-icon">₿</div>
            BTC INVEST
        </a>

        <a href="index.html" class="home">
            ← Home
        </a>

    </div>
</header>


<main>

    <div class="card">

        <div class="icon">₿</div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to your BTC Invest account.
        </p>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>


        <div id="errorMessage" class="message error"></div>


        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>

</main>


<footer>
    © 2026 BTC INVEST. All rights reserved.
</footer>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://rikpsvmhtusupnuhgrsf.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_7O3mA4KtXSRR6skAKWkgxQ_2c-8BDug";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const form =
        document.getElementById("loginForm");

    const button =
        document.getElementById("loginBtn");

    const errorMessage =
        document.getElementById("errorMessage");


    function showError(message) {

        errorMessage.textContent = message;

        errorMessage.style.display = "block";
    }


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        errorMessage.style.display = "none";

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        button.disabled = true;

        button.textContent = "Signing in...";


        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {
                throw error;
            }


            window.location.href = "dashboard.html";


        } catch (error) {

            console.error(error);

            showError(
                error.message ||
                "Login failed. Please check your email and password."
            );

        } finally {

            button.disabled = false;

            button.textContent = "Login";

        }

    });

</script>

</body>
</html>
