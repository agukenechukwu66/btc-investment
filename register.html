<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | BTC Invest</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --orange: #f7931a;
            --dark: #070b12;
            --card: #101722;
            --border: #202b3a;
            --muted: #9ba7b7;
            --green: #25d695;
            --red: #ff5c5c;
        }

        body {
            min-height: 100vh;
            background: #070b12;
            color: white;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid var(--border);
            background: #070b12;
        }

        .nav {
            max-width: 1100px;
            min-height: 70px;
            margin: auto;
            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            color: white;
            text-decoration: none;

            font-size: 21px;
            font-weight: bold;
        }

        .logo-icon {
            width: 39px;
            height: 39px;

            border-radius: 50%;

            background: var(--orange);
            color: #111;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;
            font-weight: bold;
        }

        .home {
            color: #cbd3df;
            text-decoration: none;
            font-size: 14px;
        }

        .home:hover {
            color: var(--orange);
        }

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 18px;

            padding: 35px;
        }

        .icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: var(--orange);
            color: #111;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            color: #d8dee7;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px;

            background: #0b111a;
            color: white;

            border: 1px solid var(--border);
            border-radius: 9px;

            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--orange);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;

            margin: 20px 0;

            color: var(--muted);

            font-size: 11px;
            line-height: 1.5;
        }

        .terms input {
            width: auto;
            margin-top: 2px;
        }

        .register-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 9px;

            background: var(--orange);
            color: #111;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .register-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 17px;

            padding: 13px;

            border-radius: 9px;

            font-size: 12px;
            line-height: 1.5;

            text-align: center;
        }

        .success {
            background: rgba(37,214,149,.08);
            border: 1px solid rgba(37,214,149,.25);
            color: var(--green);
        }

        .error {
            background: rgba(255,92,92,.08);
            border: 1px solid rgba(255,92,92,.25);
            color: var(--red);
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: var(--muted);
            font-size: 13px;
        }

        .login a {
            color: var(--orange);
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 25px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="nav">

        <a href="index.html" class="logo">
            <div class="logo-icon">₿</div>
            BTC INVEST
        </a>

        <a href="index.html" class="home">
            ← Home
        </a>

    </div>

</header>


<main>

    <div class="card">

        <div class="icon">₿</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your BTC Invest account.
        </p>


        <form id="registerForm">

            <div class="field">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required
                >

            </div>


            <div class="field">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repeat your password"
                    minlength="8"
                    required
                >

            </div>


            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    I agree to the site's terms and conditions.
                </span>

            </label>


            <button
                type="submit"
                class="register-btn"
                id="registerBtn"
            >
                Create Account
            </button>

        </form>


        <div id="successMessage" class="message success"></div>

        <div id="errorMessage" class="message error"></div>


        <div class="login">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</main>


<footer>
    © 2026 BTC INVEST. All rights reserved.
</footer>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://rikpsvmhtusupnuhgrsf.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_7O3mA4KtXSRR6skAKWkgxQ_2c-8BDug";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const form =
        document.getElementById("registerForm");

    const button =
        document.getElementById("registerBtn");

    const successMessage =
        document.getElementById("successMessage");

    const errorMessage =
        document.getElementById("errorMessage");


    function showError(message) {

        errorMessage.textContent = message;

        errorMessage.style.display = "block";

        successMessage.style.display = "none";
    }


    function showSuccess(message) {

        successMessage.textContent = message;

        successMessage.style.display = "block";

        errorMessage.style.display = "none";
    }


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        errorMessage.style.display = "none";
        successMessage.style.display = "none";

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (password !== confirmPassword) {

            showError("Passwords do not match.");

            return;
        }


        if (password.length < 8) {

            showError(
                "Password must contain at least 8 characters."
            );

            return;
        }


        button.disabled = true;

        button.textContent = "Creating Account...";


        try {

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {
                        data: {
                            full_name: name
                        }
                    }

                });


            if (error) {
                throw error;
            }


            showSuccess(
                "Account created successfully. " +
                "Check your email if email confirmation is enabled, " +
                "then log in."
            );


            form.reset();


            setTimeout(function() {

                window.location.href = "login.html";

            }, 2500);


        } catch (error) {

            console.error(error);

            showError(
                error.message ||
                "Unable to create the account."
            );

        } finally {

            button.disabled = false;

            button.textContent = "Create Account";

        }

    });

</script>

</body>
</html>
